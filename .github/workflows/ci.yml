name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm, wasm-gc, native]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: matrix.target == 'js'
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        if: matrix.target == 'js'
        with:
          python-version: '3.12'
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
        with:
          version: '0.10.22+124d61d05'
          core-version: '0.10.22+124d61d05'
      - run: moon version --all
      - run: moon update
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }} --deny-warn
      - name: Unit tests, the oracle's properties, and the rules at their limits
        run: moon test --target ${{ matrix.target }} --deny-warn
      - name: A campaign of twenty thousand generated reviews against the oracle
        run: moon run cmd/campaign --target ${{ matrix.target }} --deny-warn -- 20000 1 12
      - name: A campaign of twenty thousand reviews a fuzzer changed
        run: moon run cmd/campaign --target ${{ matrix.target }} --deny-warn -- mutate 20000 1
      - name: Independent oracle and CLI checks, limits included
        if: matrix.target == 'js'
        run: python scripts/verify.py --live-fixture --otio-samples
      - name: Fuzz the built command
        if: matrix.target == 'js'
        run: python scripts/fuzz.py --count 600
      - name: The oracle against the release build
        if: matrix.target == 'js'
        run: python scripts/verify.py --release --quick
  prove:
    # Why3 1.7.2 has a signal handler in C with the wrong signature, which
    # compilers took as a warning until GCC 14 made it an error. ubuntu-latest
    # is past that; 24.04's compiler still builds Why3 as it was written.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALTERGO_VERSION: 2.6.2
      CVC5_VERSION: 1.3.1
      Z3_VERSION: 4.15.3
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
        with:
          version: '0.10.22+124d61d05'
          core-version: '0.10.22+124d61d05'
      - name: Why3 1.7.2 and Alt-Ergo
        run: |
          set -euo pipefail
          opam install -y why3.1.7.2 alt-ergo.${ALTERGO_VERSION}
          echo "WHY3DATA=$(opam exec -- why3 --print-datadir)" >> "$GITHUB_ENV"
          echo "WHY3LIB=$(opam exec -- why3 --print-libdir)" >> "$GITHUB_ENV"
          ALTERGO="$(opam exec -- sh -lc 'command -v alt-ergo')"
          echo "ALTERGOPATH=$ALTERGO" >> "$GITHUB_ENV"
          echo "$(dirname "$ALTERGO")" >> "$GITHUB_PATH"
      - name: Z3 and CVC5
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/z3.zip" \
            "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/z3-${Z3_VERSION}-x64-glibc-2.39.zip"
          unzip -q "$RUNNER_TEMP/z3.zip" -d "$RUNNER_TEMP/z3"
          Z3_BIN="$(find "$RUNNER_TEMP/z3" -type f -name z3 | head -n 1)"
          echo "Z3PATH=$Z3_BIN" >> "$GITHUB_ENV"
          echo "$(dirname "$Z3_BIN")" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/cvc5.zip" \
            "https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/cvc5-Linux-x86_64-static-gpl.zip"
          unzip -q "$RUNNER_TEMP/cvc5.zip" -d "$RUNNER_TEMP/cvc5"
          CVC5_BIN="$(find "$RUNNER_TEMP/cvc5" -type f -name cvc5 | head -n 1)"
          echo "CVC5PATH=$CVC5_BIN" >> "$GITHUB_ENV"
          echo "$(dirname "$CVC5_BIN")" >> "$GITHUB_PATH"
      - run: moon update
      - name: Show tool versions
        run: |
          set -euo pipefail
          moon version --all
          opam exec -- why3 --version
          "$Z3PATH" --version
          "$CVC5PATH" --version
      - name: Prove the kernel, then break every proved rule
        run: opam exec -- python3 scripts/prove.py --why3-config .github/why3.conf
      - name: Keep the proof reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: proof-reports
          path: |
            _build/verif/**/*.proof.json
            _build/verif/**/*.mlw
  faults:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
        with:
          version: '0.10.22+124d61d05'
          core-version: '0.10.22+124d61d05'
      - run: moon version --all
      - run: moon update
      - name: Every known fault must be noticed by the tests
        run: python scripts/mutate.py --workers 4
